
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#075985">
  <title>App Mantenimiento Piscinas</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 18px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 22px;
      background: white;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000012;
    }

    h1 {
      margin-top: 0;
      color: #075985;
      font-size: 24px;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input, select, textarea, button {
      width: 100%;
      margin-top: 7px;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    input, select, textarea { background: #fff; }

    button {
      margin-top: 20px;
      border: 0;
      background: #075985;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    button.secondary { background: #475569; }

    .note {
      font-size: 14px;
      color: #475569;
      line-height: 1.5;
    }

    .error {
      display: none;
      margin-top: 5px;
      color: #b91c1c;
      font-size: 14px;
      font-weight: bold;
    }

    .error.visible { display: block; }

    #estado {
      margin-top: 16px;
      padding: 12px;
      background: #e0f2fe;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #lista {
      padding-left: 20px;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
<main>
  <h1>Mantenimiento de Piscinas</h1>

  <p class="note">
    Prototipo de prueba. Los registros se guardan en este navegador.
    Todavía no se envían a Google Sheets.
  </p>

  <form id="formulario">
    <label for="cliente">Cliente</label>
    <input id="cliente" name="cliente" type="text"
           autocomplete="off" required>

    <label for="operador">Operador</label>
    <input id="operador" name="operador" type="text"
           autocomplete="off" required>

    <label for="tipo">Tipo de visita</label>
    <select id="tipo" name="tipo" required>
      <option value="Programada">Programada</option>
      <option value="No programada">No programada</option>
    </select>

    <label for="cloro">Cloro (libras)</label>
    <input class="cantidad" id="cloro" name="cloro"
           type="text" inputmode="decimal" placeholder="Ej.: 1,5">
    <div class="error" id="error-cloro" aria-live="polite"></div>

    <label for="pastilla">Pastillas (unidades)</label>
    <input class="cantidad" id="pastilla" name="pastilla"
           type="text" inputmode="decimal" placeholder="Ej.: 1">
    <div class="error" id="error-pastilla" aria-live="polite"></div>

    <label for="floculante">Floculante (cantidad)</label>
    <input class="cantidad" id="floculante" name="floculante"
           type="text" inputmode="decimal" placeholder="Ej.: 0,5">
    <div class="error" id="error-floculante" aria-live="polite"></div>

    <label for="sal">Sal (kg)</label>
    <input class="cantidad" id="sal" name="sal"
           type="text" inputmode="decimal" placeholder="Ej.: 2,5">
    <div class="error" id="error-sal" aria-live="polite"></div>

    <label for="novedades">Novedades</label>
    <textarea id="novedades" name="novedades" rows="3"></textarea>

    <label for="foto">Foto de mantenimiento (opcional)</label>
    <input id="foto" name="foto" type="file" accept="image/*"
           capture="environment">

    <button type="submit">Guardar visita en este dispositivo</button>
  </form>

  <div id="estado" role="status">
    Todavía no hay visitas guardadas en esta sesión.
  </div>

  <h2>Visitas guardadas</h2>
  <p class="note">
    Registros almacenados localmente en este navegador.
  </p>
  <ul id="lista"></ul>

  <button type="button" class="secondary" id="exportar">
    Exportar registros de prueba (JSON)
  </button>
</main>

<script>
(() => {
  "use strict";

  const CLAVE = "visitasPiscinasPendientes";
  const DB_NOMBRE = "mantenimientoPiscinasDB";
  const DB_VERSION = 1;

  const formulario = document.getElementById("formulario");
  const estado = document.getElementById("estado");
  const lista = document.getElementById("lista");
  const camposCantidad = Array.from(document.querySelectorAll(".cantidad"));
  let db = null;

  function abrirDB() {
    return new Promise((resolve, reject) => {
      const solicitud = indexedDB.open(DB_NOMBRE, DB_VERSION);

      solicitud.onupgradeneeded = () => {
        const base = solicitud.result;
        if (!base.objectStoreNames.contains("visitas")) {
          base.createObjectStore("visitas", { keyPath: "id" });
        }
      };
      solicitud.onsuccess = () => resolve(solicitud.result);
      solicitud.onerror = () => reject(solicitud.error);
    });
  }

  function leerRegistrosAntiguos() {
    try {
      const datos = JSON.parse(localStorage.getItem(CLAVE) || "[]");
      return Array.isArray(datos) ? datos : [];
    } catch (error) {
      return [];
    }
  }

  function obtenerTodas() {
    return new Promise((resolve, reject) => {
      const tx = db.transaction("visitas", "readonly");
      const solicitud = tx.objectStore("visitas").getAll();
      solicitud.onsuccess = () => resolve(solicitud.result || []);
      solicitud.onerror = () => reject(solicitud.error);
    });
  }

  function guardarEnDB(registro) {
    return new Promise((resolve, reject) => {
      const tx = db.transaction("visitas", "readwrite");
      tx.objectStore("visitas").put(registro);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
      tx.onabort = () => reject(tx.error || new Error("Transacción cancelada"));
    });
  }

  async function migrarRegistrosAntiguos() {
    const antiguos = leerRegistrosAntiguos();
    if (!antiguos.length) return 0;

    const actuales = await obtenerTodas();
    const ids = new Set(actuales.map(registro => registro.id));
    let migrados = 0;

    for (const registro of antiguos) {
      if (!registro || !registro.id || ids.has(registro.id)) continue;
      await guardarEnDB(registro);
      ids.add(registro.id);
      migrados++;
    }
    return migrados;
  }

  async function mostrarRegistros() {
    lista.replaceChildren();
    const registros = (await obtenerTodas()).sort(
      (a, b) => new Date(b.fecha).getTime() - new Date(a.fecha).getTime()
    );

    if (registros.length === 0) {
      const li = document.createElement("li");
      li.textContent = "Todavía no hay visitas guardadas.";
      lista.appendChild(li);
      return;
    }

    registros.forEach(registro => {
      const li = document.createElement("li");
      const fecha = new Date(registro.fecha).toLocaleString("es-EC");
      const tieneFoto = registro.foto instanceof Blob;
      li.textContent =
        `${registro.cliente} — ${registro.tipo} — ${fecha} — ` +
        `${registro.estado}${tieneFoto ? " — Foto guardada" : ""}`;
      lista.appendChild(li);
    });
  }

  function mostrarError(campo, mensaje) {
    const error = document.getElementById("error-" + campo.id);
    if (!error) return;
    error.textContent = mensaje;
    error.classList.toggle("visible", mensaje !== "");
    campo.setAttribute("aria-invalid", mensaje ? "true" : "false");
  }

  function validarCantidad(campo) {
    const valor = campo.value.trim();

    if (valor === "") {
      mostrarError(campo, "");
      return true;
    }

    if (!/^\d+(,\d+)?$/.test(valor)) {
      mostrarError(
        campo,
        "Usa coma para los decimales. Ejemplo: 1,5. No uses punto."
      );
      return false;
    }

    mostrarError(campo, "");
    return true;
  }

  camposCantidad.forEach(campo => {
    campo.addEventListener("input", () => {
      if (campo.value.includes(".")) {
        campo.value = campo.value.replace(/\./g, "");
        mostrarError(
          campo,
          "No se permite el punto decimal. Usa coma, por ejemplo: 1,5."
        );
      } else {
        validarCantidad(campo);
      }
    });

    campo.addEventListener("blur", () => validarCantidad(campo));
  });

  formulario.addEventListener("submit", async event => {
    event.preventDefault();

    let cantidadesValidas = true;
    camposCantidad.forEach(campo => {
      if (!validarCantidad(campo)) cantidadesValidas = false;
    });

    if (!cantidadesValidas) {
      estado.textContent = "Revisa las cantidades marcadas antes de guardar.";
      return;
    }

    const foto = document.getElementById("foto").files[0] || null;

    const registro = {
      id: (window.crypto && crypto.randomUUID)
        ? crypto.randomUUID()
        : String(Date.now()) + "-" + Math.random().toString(16).slice(2),
      fecha: new Date().toISOString(),
      cliente: document.getElementById("cliente").value.trim(),
      operador: document.getElementById("operador").value.trim(),
      tipo: document.getElementById("tipo").value,
      cloro: document.getElementById("cloro").value.trim(),
      pastilla: document.getElementById("pastilla").value.trim(),
      floculante: document.getElementById("floculante").value.trim(),
      sal: document.getElementById("sal").value.trim(),
      novedades: document.getElementById("novedades").value.trim(),
      estado: "Pendiente de sincronización",
      foto: foto
    };

    try {
      await guardarEnDB(registro);
      try {
  const URL_SERVIDOR = "https://script.google.com/macros/s/AKfycbyLhmS_gfASlK7imEf38nGu3YorNAq5ELb8XanVIj-tc8ESdutzxYdpUSbEjALSxecz/exec";

  fetch(URL_SERVIDOR, {
    method: "POST",
    mode: "no-cors",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      mensaje: "Prueba PWA: " + registro.cliente,
      visita: {
        id: registro.id,
        fecha: registro.fecha,
        cliente: registro.cliente,
        operador: registro.operador,
        tipo: registro.tipo,
        cloro: registro.cloro,
        pastilla: registro.pastilla,
        floculante: registro.floculante,
        sal: registro.sal,
        novedades: registro.novedades
      }
    })
  });
} catch (error) {
  console.error("No se pudo iniciar el envío al servidor", error);
}
      estado.textContent =
        "Visita guardada en este navegador. " +
        (foto ? "La fotografía también se guardó localmente. " : "") +
        "Aún no se ha enviado al servidor.";

      formulario.reset();
      camposCantidad.forEach(campo => mostrarError(campo, ""));
      await mostrarRegistros();
    } catch (error) {
      estado.textContent =
        "No se pudo guardar. Comprueba el espacio disponible del navegador e inténtalo de nuevo.";
    }
  });

  document.getElementById("exportar").addEventListener("click", async () => {
    try {
      const registros = await obtenerTodas();
      const salida = registros.map(registro => {
        const copia = { ...registro };
        if (copia.foto instanceof Blob) {
          copia.foto = {
            almacenada: true,
            tipo: copia.foto.type,
            tamanoBytes: copia.foto.size,
            nota: "La imagen permanece en IndexedDB; este JSON no contiene sus datos binarios."
          };
        }
        return copia;
      });

      const archivo = new Blob(
        [JSON.stringify(salida, null, 2)],
        { type: "application/json;charset=utf-8" }
      );
      const url = URL.createObjectURL(archivo);
      const enlace = document.createElement("a");
      enlace.href = url;
      enlace.download = "visitas-piscinas-prueba.json";
      enlace.click();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
      estado.textContent =
        "Se exportó el listado. Las fotos siguen guardadas en este navegador y no se incluyen en el JSON.";
    } catch (error) {
      estado.textContent = "No se pudieron exportar los registros.";
    }
  });

  (async () => {
    try {
      db = await abrirDB();
      const migrados = await migrarRegistrosAntiguos();
      await mostrarRegistros();
      estado.textContent = migrados
        ? `Almacenamiento preparado. Se copiaron ${migrados} registro(s) anteriores.`
        : "Almacenamiento local preparado. Las nuevas visitas se guardarán en IndexedDB.";
    } catch (error) {
      estado.textContent =
        "No se pudo iniciar el almacenamiento local. No guardes visitas hasta resolverlo.";
      formulario.querySelector('button[type="submit"]').disabled = true;
    }
  })();
})();
</script>
  
<script>
if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js")
      .then(() => console.log("Service worker registrado correctamente"))
      .catch(error => console.error("Error al registrar el service worker:", error));
  });
}
</script>

</body>
</html>
